<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>halfurness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="hub.css">
</head>
<body>
    <main class="hub">
        <header class="hub-header">
            <h1>halfurness</h1>
            <p>Projects</p>

        <div class="project-grid">
            <a href="/crumble/" class="project-card">
                <img src="/crumble/icon.png" alt="Crumble" class="project-icon">
                <div class="project-info">
                    <h2>Crumble</h2>
                    <p>Web viewer for recipes backed up from the Crumble Android app</p>
                </div>
                <span class="material-icons project-arrow">arrow_forward</span>

        </div>
    </main>
